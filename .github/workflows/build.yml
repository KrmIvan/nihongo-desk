# Compila y prueba los distribuibles de Windows y Linux.
# · Cada push a main y a mano (Actions → Build → Run workflow): artefactos descargables.
# · Al crear una etiqueta vX.Y.Z: además publica una Release con los archivos.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon0 libgl1 fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: QT_QPA_PLATFORM=offscreen pytest -q

  windows:
    needs: tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compilar (exe + ZIP portable + instalador) y autoprueba
        shell: pwsh
        run: packaging\windows\build_windows.ps1
      - name: Probar el instalador (instalar, actualizar, desinstalar)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem dist\*-setup.exe | Select-Object -First 1).FullName
          $args_ = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=desktopicon"
          $p = Start-Process $setup -ArgumentList $args_ -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalación: código $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\Nihongo Desk"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Nihongo Desk\Nihongo Desk.lnk"
          $desk = [Environment]::GetFolderPath("Desktop") + "\Nihongo Desk.lnk"
          foreach ($f in "$dir\NihongoDesk.exe", $menu, $desk) {
            if (-not (Test-Path $f)) { throw "falta $f" }; Write-Host "OK $f"
          }
          $p = Start-Process "$dir\NihongoDesk.exe" -ArgumentList "--selftest=$env:RUNNER_TEMP\installed.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\installed.txt"
          if ($p.ExitCode -ne 0) { throw "autoprueba del programa instalado" }
          # datos del usuario: deben sobrevivir a actualizar y desinstalar
          $data = "$env:APPDATA\NihongoDesk"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\marca.txt" "progreso"
          $p = Start-Process $setup -ArgumentList $args_ -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "actualización: código $($p.ExitCode)" }
          if (-not (Test-Path "$data\marca.txt")) { throw "la actualización borró datos del usuario" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "$dir\NihongoDesk.exe") { throw "la desinstalación no quitó el programa" }
          if (Test-Path $menu) { throw "la desinstalación no quitó el acceso directo" }
          if (-not (Test-Path "$data\marca.txt")) { throw "la desinstalación borró datos del usuario" }
          Write-Host "Instalar / actualizar / desinstalar: OK (datos del usuario conservados)"
      - name: Probar el ZIP portable
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\*-portable.zip | Select-Object -First 1).FullName
          Expand-Archive $zip "$env:RUNNER_TEMP\portable"
          $p = Start-Process "$env:RUNNER_TEMP\portable\NihongoDesk\NihongoDesk.exe" -ArgumentList "--selftest=$env:RUNNER_TEMP\portable.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\portable.txt"
          if ($p.ExitCode -ne 0) { throw "autoprueba del portable" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  linux:
    needs: tests
    runs-on: ubuntu-22.04   # glibc 2.35: el AppImage funciona en distros de 2022 en adelante
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-image0 xvfb
      - name: Compilar AppImage y autoprueba en X11 (xvfb)
        run: PYTHON=python xvfb-run -a ./packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  linux-distros:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:41", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: linux}
      - name: Autoprueba en ${{ matrix.image }} (sistema mínimo + librerías gráficas básicas)
        shell: bash
        run: |
          case "${{ matrix.image }}" in
            ubuntu*|debian*) apt-get update -qq && apt-get install -y -qq libgl1 libegl1 libfontconfig1 libxkbcommon0 libglib2.0-0 libdbus-1-3 >/dev/null ;;
            fedora*) dnf install -y -q mesa-libGL mesa-libEGL fontconfig libxkbcommon glib2 dbus-libs ;;
            arch*) pacman -Sy --noconfirm --quiet libglvnd fontconfig libxkbcommon glib2 dbus >/dev/null ;;
          esac
          chmod +x NihongoDesk-*.AppImage
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 NIHONGO_NO_DESKTOP_INTEGRATION=1 \
            ./NihongoDesk-*.AppImage --selftest=report.txt || true
          cat report.txt
          grep -q "RESULTADO: OK" report.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-distros]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
