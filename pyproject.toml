[project]
name = "nihongo-desk"
version = "0.1.0"
description = "Ventana flotante para estudiar japonés en sesiones cortas"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
nihongo-desk = "nihongo_desk.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nihongo_desk*"]

[tool.setuptools.package-data]
nihongo_desk = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
